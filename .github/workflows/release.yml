name: release

# Builds the Linux release packages and the Windows wallet (windows.yml) in public,
# from this repository's code. Changing release/VERSION on main publishes GitHub
# release v<VERSION> with the packages + SHA256 files.
on:
  push:
    branches: [main]
    paths: ["release/VERSION"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ver: "22.04"
          - os: ubuntu-24.04
            ver: "24.04"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake pkg-config \
            libssl-dev libzmq3-dev libunbound-dev libsodium-dev libunwind8-dev liblzma-dev \
            libreadline-dev libexpat1-dev libpgm-dev libhidapi-dev libusb-1.0-0-dev libudev-dev \
            libprotobuf-dev protobuf-compiler qttools5-dev-tools \
            libboost-chrono-dev libboost-date-time-dev libboost-filesystem-dev libboost-locale-dev \
            libboost-program-options-dev libboost-regex-dev libboost-serialization-dev \
            libboost-system-dev libboost-thread-dev

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DARCH=x86-64 -DBUILD_TESTS=OFF -DUSE_DEVICE_TREZOR=OFF -DMANUAL_SUBMODULES=1
          make -j"$(nproc)" daemon simplewallet wallet_rpc_server

      - name: Package
        run: ./release/package.sh "${{ matrix.ver }}"

      - uses: actions/upload-artifact@v4
        with:
          name: grox-ubuntu${{ matrix.ver }}
          path: dist/*

  windows:
    uses: ./.github/workflows/windows.yml

  xmrig:
    uses: ./.github/workflows/xmrig.yml

  publish:
    needs: [build, windows, xmrig]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: grox-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < release/VERSION)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" --title "Grox $TAG" \
              --notes "Windows: download GroxWallet-Setup-*-win-x64.exe (installer) or the portable zip. Linux: x64 packages for Ubuntu 22.04 and 24.04 (also WSL), or use install.sh which checks the SHA256 for you. XMRig miner with Grox support (rx/grox): xmrig-grox-*-win-x64.zip and xmrig-grox-*-linux-x64.tar.gz. Built by GitHub Actions from commit $GITHUB_SHA. Verify downloads with the .sha256 files."
          fi
